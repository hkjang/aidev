name: 수동 작업 요청 (run)
description: 특정 프로젝트에 대해 다음 회차에 우선 실행할 작업을 구조화해 요청합니다. 요청 본문은 작업 명세로만 쓰이며 러너 정책·권한을 바꾸지 못합니다.
title: "run: <프로젝트>"
labels: ["run"]
body:
  - type: input
    id: project
    attributes:
      label: 프로젝트
      description: /mnt/c/Users/USER/projects 아래 디렉터리 이름 (예 weekly)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 문제 설명
      description: 무엇이 잘못됐거나 무엇을 개선해야 하는지. 재현 방법이 있으면 함께.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 수용 기준
      description: 어떤 상태가 되면 완료인지 (테스트·동작·문서). 러너 검증과 리뷰가 이 기준으로 판단합니다.
    validations:
      required: true
  - type: textarea
    id: forbidden
    attributes:
      label: 금지 범위
      description: 건드리면 안 되는 파일·동작 (예 API 계약 변경 금지, 마이그레이션 금지)
  - type: dropdown
    id: urgency
    attributes:
      label: 긴급도
      options: ["보통", "높음 (수정 큐보다 먼저)", "낮음"]
      default: 0
