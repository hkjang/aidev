# GitHub Pages (Jekyll) 설정 — SEO/AEO 메타는 jekyll-seo-tag, 사이트맵은 jekyll-sitemap 이 만든다
title: aidev 자율 개선 대시보드
tagline: Claude Code 자율 개선 에이전트의 일일 보고
description: hkjang 의 프로젝트들을 Claude Code 에이전트가 스스로 개선·테스트·머지·릴리즈한 결과를 회차마다 갱신하는 일일 보고 대시보드
url: https://hkjang.github.io
baseurl: /aidev
lang: ko
locale: ko_KR
author:
  name: hkjang
  url: https://github.com/hkjang
github_username: hkjang
repository: hkjang/aidev
logo: /assets/og.png
permalink: pretty
timezone: Asia/Seoul
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
defaults:
  - scope: { path: "" }
    values: { layout: default, image: /assets/og.png }
  - scope: { path: "reports" }
    values: { type: report }
  - scope: { path: "projects" }
    values: { type: project }
  - scope: { path: "weekly" }
    values: { type: report }
  - scope: { path: "monthly" }
    values: { type: report }
include:
  - data/runs.jsonl
  - data/health.json
  - data/usage.jsonl
  - data/summary.json
