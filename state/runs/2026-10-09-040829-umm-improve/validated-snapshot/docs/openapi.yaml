openapi: 3.1.0
info:
  title: umm API
  version: 0.8.1
  description: |
    Spatial Thought Memory, collaboration, automation and Dream Layer API.
    Supported Canvas mutation requests can include an `Idempotency-Key` header (8-128 safe characters) for replay-safe offline synchronization.
    Personal preferences, API-key lifecycle operations and all administrator operations require an interactive browser session; bearer API keys cannot call them.
    Errors use RFC 9457 Problem Details and note version conflicts include the latest server note.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: Auth
  - name: Thoughts
  - name: Collaboration
  - name: Review
  - name: AI
  - name: Personal
  - name: Webhooks
  - name: Dream
  - name: Workflow
  - name: Observability
  - name: Admin
paths:
  /meta:
    get:
      operationId: get_meta
      security: []
      summary: Get public service name, version and enabled login methods
      responses:
        '200': { description: Public metadata, content: { application/json: { schema: { $ref: '#/components/schemas/Meta' } } } }
  /auth/login:
    post:
      operationId: post_auth_login
      security: []
      tags: [Auth]
      summary: Sign in with the local password; concurrent guesses share the configured PostgreSQL-backed ceiling
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [username, password], properties: { username: { type: string }, password: { type: string, format: password } } } } }
      responses:
        '200': { description: Signed in, headers: { Set-Cookie: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '429': { description: login-locked Problem Details with Retry-After after the shared failure ceiling, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Fail-closed response when the durable throttle cannot be checked or committed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/oidc/start:
    get:
      operationId: get_auth_oidc_start
      security: []
      tags: [Auth]
      summary: Begin Keycloak Authorization Code flow
      description: >-
        return_to must be a site path — starting with one slash, not two — or it becomes /.
        prompt=none asks Keycloak to answer from an existing session without drawing a screen (silent SSO);
        it is honoured only while the administrator has turned auto_login on, and is otherwise treated as an
        ordinary login so that appending it to a URL cannot change the flow.
      parameters:
        - { in: query, name: return_to, schema: { type: string, default: / } }
        - { in: query, name: prompt, schema: { type: string, enum: [none] } }
      responses: { '302': { description: Redirect to Keycloak } }
  /auth/oidc/callback:
    get:
      operationId: get_auth_oidc_callback
      security: []
      tags: [Auth]
      summary: Complete Keycloak Authorization Code flow
      description: >-
        When Keycloak answers with error instead of code the browser is sent to the login screen:
        /login?sso=none for login_required, interaction_required and consent_required (the ordinary reply to a
        silent prompt=none attempt when there is no session — the marker tells the browser not to try again),
        /login?sso=error for anything else.
      parameters:
        - { in: query, name: state, required: true, schema: { type: string } }
        - { in: query, name: code, schema: { type: string } }
        - { in: query, name: error, schema: { type: string } }
      responses: { '302': { description: Session established and redirected to return_to, or refused and redirected to /login } }
  /auth/logout:
    post:
      operationId: post_auth_logout
      tags: [Auth]
      summary: Revoke the current browser session
      responses: { '200': { description: Signed out } }
  /me:
    get:
      operationId: get_me
      tags: [Auth]
      summary: Get the authenticated user
      responses: { '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } } }
  /metrics:
    get:
      operationId: get_metrics
      tags: [Observability]
      summary: Export Prometheus request and build metrics
      description: Requires an administrator browser session or an API key with the explicit metrics:read scope. A regular browser session and an administrator-owned key without that scope are denied.
      x-required-scope: metrics:read
      responses:
        '200': { description: Prometheus text exposition, content: { text/plain: { schema: { type: string } } } }
        '403': { description: Administrator session or dedicated metrics scope required }
  /today:
    get:
      operationId: get_today
      tags: [Review]
      summary: Get the daily review dashboard
      description: Returns due thoughts, unconnected thoughts, recent collaboration activity and onboarding progress. Pending Dreams require dreams:read and current owner/member access to their space; otherwise they are omitted and the count reflects only accessible Dreams.
      x-required-scope: notes:read
      responses:
        '200': { description: Daily review, content: { application/json: { schema: { $ref: '#/components/schemas/TodayReview' } } } }
  /onboarding:
    get:
      operationId: get_onboarding
      tags: [Review]
      summary: Get contextual onboarding progress
      x-required-scope: notes:read
      responses:
        '200': { description: Onboarding progress, content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingProgress' } } } }
  /onboarding/complete:
    post:
      operationId: post_onboarding_complete
      tags: [Review]
      summary: Mark contextual onboarding as complete
      x-required-scope: notes:write
      responses: { '200': { description: Onboarding completed } }
  /spaces:
    get:
      operationId: get_spaces
      tags: [Thoughts]
      summary: List visible spaces
      x-required-scope: spaces:read
      responses: { '200': { description: Spaces, content: { application/json: { schema: { type: object, properties: { spaces: { type: array, items: { $ref: '#/components/schemas/Space' } } } } } } } }
    post:
      operationId: post_spaces
      tags: [Thoughts]
      summary: Create a space
      x-required-scope: notes:write
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 200 } } } } } }
      responses: { '201': { description: Space created, content: { application/json: { schema: { $ref: '#/components/schemas/Space' } } } } }
  /search:
    get:
      operationId: get_search
      tags: [Thoughts]
      summary: Hybrid semantic and lexical search across accessible spaces
      x-required-scope: notes:read
      parameters:
        - { in: query, name: q, required: true, schema: { type: string, maxLength: 200 } }
        - { in: query, name: spaceId, schema: { type: string, format: uuid } }
        - { in: query, name: kind, schema: { type: string } }
        - { in: query, name: updatedFrom, schema: { type: string, format: date-time } }
        - { in: query, name: updatedTo, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Cursor' }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Ranked note shortcuts
          content:
            application/json:
              schema:
                type: object
                required: [notes, nextCursor]
                properties:
                  notes: { type: array, items: { $ref: '#/components/schemas/NoteSearchResult' } }
                  nextCursor: { type: string }
                  noteLines:
                    type: object
                    description: >
                      Maps a result to the line of thinking it belongs to, when it belongs to
                      one. A result whose line is 'abandoned' was considered and set aside,
                      with the reason recorded, and must not be presented as current. Search
                      is where a thought is met most often, and an unlabelled result reads
                      exactly like a live one.
                    additionalProperties: { $ref: '#/components/schemas/Branch' }
  /spaces/{spaceId}/notes:
    parameters:
      - { $ref: '#/components/parameters/SpaceID' }
    get:
      operationId: get_spaces_spaceId_notes
      tags: [Thoughts]
      summary: List or search notes and edges in a space
      x-required-scope: notes:read
      parameters:
        - { in: query, name: q, schema: { type: string } }
      responses:
        '200':
          description: Canvas graph
          content: { application/json: { schema: { type: object, properties: { notes: { type: array, items: { $ref: '#/components/schemas/Note' } }, edges: { type: array, items: { $ref: '#/components/schemas/Edge' } } } } } }
    post:
      operationId: post_spaces_spaceId_notes
      tags: [Thoughts]
      summary: Drop a post-it onto the canvas
      x-required-scope: notes:write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NoteWrite' } } } }
      responses: { '201': { description: Note created, content: { application/json: { schema: { $ref: '#/components/schemas/Note' } } } } }
  /spaces/{spaceId}:
    parameters:
      - { $ref: '#/components/parameters/SpaceID' }
    put:
      operationId: put_spaces_spaceId
      tags: [Thoughts]
      summary: Rename a space or change its AI exclusion policy
      x-required-scope: notes:write
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 200 }, aiExcluded: { type: boolean, description: Exclude every note in this space from AI processing and remote embedding gateways } } } } }
      responses:
        '200': { description: Space updated, content: { application/json: { schema: { $ref: '#/components/schemas/Space' } } } }
    delete:
      operationId: delete_spaces_spaceId
      tags: [Thoughts]
      summary: Permanently delete an owned space and its contents
      description: Only the owner can delete a space. Notes, edges, Dream records and membership data in it are removed by cascade.
      x-required-scope: notes:write
      responses:
        '204': { description: Space deleted }
        '403': { $ref: '#/components/responses/Error' }
  /notes/{noteId}:
    parameters:
      - { $ref: '#/components/parameters/NoteID' }
    put:
      operationId: put_notes_noteId
      tags: [Thoughts]
      summary: Autosave note content, appearance and position
      description: Uses optimistic concurrency. Send the last server version; a stale version returns 409. A caller who can still view the note but no longer edit its space receives a terminal note-read-only 403 Problem Details response.
      x-required-scope: notes:write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NoteUpdate' } } } }
      responses:
        '200': { description: Updated note, content: { application/json: { schema: { $ref: '#/components/schemas/Note' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    delete:
      operationId: delete_notes_noteId
      tags: [Thoughts]
      summary: Soft-delete a note
      x-required-scope: notes:write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '204': { description: Deleted } }
  /notes/{noteId}/related:
    parameters:
      - { $ref: '#/components/parameters/NoteID' }
    get:
      operationId: get_notes_noteId_related
      tags: [Thoughts]
      summary: Discover semantically related thoughts with the offline embedding
      x-required-scope: notes:read
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 20, default: 8 } }
      responses:
        '200': { description: Ranked related thoughts, content: { application/json: { schema: { type: object, properties: { related: { type: array, items: { $ref: '#/components/schemas/RelatedNote' } } } } } } }
  /notes/{noteId}/backlinks:
    parameters:
      - { $ref: '#/components/parameters/NoteID' }
    get:
      operationId: get_notes_noteId_backlinks
      tags: [Thoughts]
      summary: List incoming and outgoing thought links
      x-required-scope: notes:read
      responses:
        '200': { description: Backlinks, content: { application/json: { schema: { type: object, required: [backlinks], properties: { backlinks: { type: array, items: { $ref: '#/components/schemas/Backlink' } } } } } } }
  /notes/{noteId}/review:
    parameters:
      - { $ref: '#/components/parameters/NoteID' }
    post:
      operationId: post_notes_noteId_review
      tags: [Review]
      summary: Complete, snooze or pin a thought review
      x-required-scope: notes:write
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { snoozeDays: { type: integer, minimum: 1, maximum: 365 }, pinned: { type: boolean }, complete: { type: boolean, default: true, description: Set false to change only the pinned state without completing the review. } } } } }
      responses:
        '200': { description: Updated review item, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewItem' } } } }
  /notes/{noteId}/comments:
    parameters:
      - { $ref: '#/components/parameters/NoteID' }
    get:
      operationId: get_notes_noteId_comments
      tags: [Collaboration]
      summary: List note comments and mention metadata
      x-required-scope: notes:read
      responses:
        '200': { description: Comments, content: { application/json: { schema: { type: object, required: [comments], properties: { comments: { type: array, items: { $ref: '#/components/schemas/Comment' } } } } } } }
    post:
      operationId: post_notes_noteId_comments
      tags: [Collaboration]
      summary: Add a comment and notify mentioned space members
      x-required-scope: notes:write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string, minLength: 1, maxLength: 4000 }, parentId: { type: [string, 'null'], format: uuid } } } } }
      responses:
        '201': { description: Comment created, content: { application/json: { schema: { $ref: '#/components/schemas/Comment' } } } }
  /comments/{commentId}/resolve:
    parameters:
      - { $ref: '#/components/parameters/CommentID' }
    put:
      operationId: put_comments_commentId_resolve
      tags: [Collaboration]
      summary: Resolve or reopen a comment thread; permanently forbidden replays return comment-mutation-forbidden
      x-required-scope: notes:write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [resolved], properties: { resolved: { type: boolean } } } } }
      responses:
        '200': { description: Updated comment, content: { application/json: { schema: { $ref: '#/components/schemas/Comment' } } } }
        '403': { description: Terminal comment-mutation-forbidden Problem Details when the current session can no longer mutate the comment, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /comments/{commentId}:
    parameters:
      - { $ref: '#/components/parameters/CommentID' }
    delete:
      operationId: delete_comments_commentId
      tags: [Collaboration]
      summary: Soft-delete an authored or managed comment; permanently forbidden replays return comment-mutation-forbidden
      x-required-scope: notes:write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: Comment deleted }
        '403': { description: Terminal comment-mutation-forbidden Problem Details when the current session can no longer mutate the comment, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /notes/{noteId}/history:
    parameters:
      - { $ref: '#/components/parameters/NoteID' }
    get:
      operationId: get_notes_noteId_history
      tags: [Thoughts]
      summary: List autosaved revisions of a note
      responses:
        '200': { description: Revisions, content: { application/json: { schema: { type: object, properties: { history: { type: array, items: { $ref: '#/components/schemas/NoteRevision' } } } } } } }
  /notes/{noteId}/restore/{version}:
    parameters:
      - { $ref: '#/components/parameters/NoteID' }
      - { in: path, name: version, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: post_notes_noteId_restore_version
      tags: [Thoughts]
      summary: Restore a prior revision while preserving the current state in history
      responses: { '200': { description: Restored note, content: { application/json: { schema: { $ref: '#/components/schemas/Note' } } } } }
  /spaces/{spaceId}/clusters:
    parameters:
      - { $ref: '#/components/parameters/SpaceID' }
    get:
      operationId: get_spaces_spaceId_clusters
      tags: [Thoughts]
      summary: Group a space into the handful of things it is about
      x-required-scope: notes:read
      responses:
        '200': { description: Thought clusters, content: { application/json: { schema: { type: object, properties: { clusters: { type: array, items: { $ref: '#/components/schemas/ThoughtCluster' } } } } } } }
  /spaces/{spaceId}/presentation/preview:
    parameters:
      - { $ref: '#/components/parameters/SpaceID' }
    get:
      operationId: get_spaces_spaceId_presentation_preview
      tags: [Thoughts]
      summary: See what this space would become as a talk, without making anything
      description: >-
        Compiles the space's thoughts and connections into an ordered talk and
        returns it with the Ptium deck source it produced. Nothing is created
        and nothing is recorded. Slide text is the author's own sentences,
        unchanged. `checked` says whether Ptium measured the result against a
        real template, which it can only do against a deck that already exists —
        pass `deckId` for that.
      x-required-scope: notes:read
      parameters:
        - { in: query, name: title, schema: { type: string } }
        - { in: query, name: includeExcluded, schema: { type: boolean } }
        - { in: query, name: oneSlidePerThought, schema: { type: boolean }, description: Turn off grouping thoughts by where they sit on the canvas. }
        - { in: query, name: nameGroups, schema: { type: boolean }, description: "Ask the chat model to name each group. Only the headings; the sentences on the slides are the author's either way." }
        - { in: query, name: sectionDeck, schema: { type: boolean }, description: Ask the chat model where a long talk divides into parts. Adds heading slides and moves nothing. }
        - { in: query, name: maxSlides, schema: { type: integer, minimum: 1, maximum: 500 }, description: "Cap the talk at this many slides. Omitted or 0 means no cap. The slides carrying least are dropped and what they held is reported in the storyline's Trimmed, never silently. Anything that is not a number is read as no cap rather than refused." }
        - { in: query, name: deckId, schema: { type: string } }
      responses:
        '200': { description: The compiled talk, content: { application/json: { schema: { $ref: '#/components/schemas/PresentationPreview' } } } }
        '400': { description: Nothing in this space can become a talk }
  /spaces/{spaceId}/presentations:
    parameters:
      - { $ref: '#/components/parameters/SpaceID' }
    get:
      operationId: get_spaces_spaceId_presentations
      tags: [Thoughts]
      summary: List the talks made from this space
      x-required-scope: notes:read
      responses:
        '200': { description: Presentation links, content: { application/json: { schema: { type: object, properties: { presentations: { type: array, items: { $ref: '#/components/schemas/PresentationLink' } } } } } } }
    post:
      operationId: post_spaces_spaceId_presentations
      tags: [Thoughts]
      summary: Compile this space into a Ptium deck
      description: >-
        Creates a deck in Ptium and compiles the space into it. Requires
        notes:write rather than notes:read because it sends the author's
        thoughts to another service and creates something there.
      x-required-scope: notes:write
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                noteIds: { type: array, items: { type: string, format: uuid } }
                includeExcluded: { type: boolean }
                oneSlidePerThought: { type: boolean, description: Turn off grouping thoughts by where they sit on the canvas. What the person connected still travels together. }
                nameGroups: { type: boolean, description: "Ask the chat model to name each group of thoughts that were put together by position. Only the headings: the sentences on the slides are the author's either way. Opt-in, because it sends those thoughts to the gateway and makes the deck stop being the same every time. Ignored when no chat model is configured." }
                sectionDeck: { type: boolean, description: "Ask the chat model where a long talk divides into parts. Adds heading slides and moves nothing: the order is a follows chain or the layout the author made, and rearranging it would override what they said. Ignored below 12 slides or with no chat model." }
                maxSlides: { type: integer, minimum: 1, maximum: 500, description: "Cap the talk at this many slides. Omitted or 0 means no cap. Ranking is deterministic and reads only the graph — how many thoughts reached a slide, whether it holds a recorded disagreement — so the same space and the same cap always give the same deck. Part headings count against it too. What did not fit is recorded as trimmedCount." }
      responses:
        '201': { description: The deck, content: { application/json: { schema: { type: object, properties: { link: { $ref: '#/components/schemas/PresentationLink' }, warnings: { type: array, items: { type: string } } } } } } }
        '400': { description: Nothing in this space can become a talk }
        '409': { description: No Ptium is configured }
        '422': { $ref: '#/components/responses/PtiumFailure' }
        '502': { $ref: '#/components/responses/PtiumFailure' }
        '504': { $ref: '#/components/responses/PtiumFailure' }
  /presentations/{linkId}/retry:
    parameters:
      - { in: path, name: linkId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: post_presentations_linkId_retry
      tags: [Thoughts]
      summary: Compile the space again into the deck a failed attempt already made
      description: >-
        Making a deck is two calls: Ptium opens one, then umm compiles source
        into it. When the second fails the deck exists and is empty, and making
        another would leave the first behind. This applies source to the deck
        that is already there. Ptium's source endpoint replaces rather than
        appends, so running it twice is the same as running it once. The space
        is recompiled rather than replayed from the stored source, because the
        thinking has probably moved on. Only a failed attempt may be retried.
      x-required-scope: notes:write
      responses:
        '200': { description: The deck, now compiled, content: { application/json: { schema: { type: object, properties: { link: { $ref: '#/components/schemas/PresentationLink' }, warnings: { type: array, items: { type: string } } } } } } }
        '404': { description: No failed attempt with this id that the caller may write to }
        '422': { $ref: '#/components/responses/PtiumFailure' }
        '502': { $ref: '#/components/responses/PtiumFailure' }
        '504': { $ref: '#/components/responses/PtiumFailure' }
  /presentations/{linkId}/sources:
    parameters:
      - { in: path, name: linkId, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: get_presentations_linkId_sources
      tags: [Thoughts]
      summary: Which thoughts each slide quotes, and the source umm compiled
      description: >-
        The slides carry the author's own words, so being able to get back to
        the note is being able to check that nothing was put in their mouth.
      x-required-scope: notes:read
      responses:
        '200': { description: Slide sources and what has changed since, content: { application/json: { schema: { type: object, properties: { source: { type: string }, sources: { type: array, items: { $ref: '#/components/schemas/SlideSource' } }, stale: { type: array, items: { $ref: '#/components/schemas/StaleSlide' } } } } } } }
        '404': { description: No such presentation }
  /notes/{noteId}/presentations:
    parameters:
      - { $ref: '#/components/parameters/NoteID' }
    get:
      operationId: get_notes_noteId_presentations
      tags: [Thoughts]
      summary: Which talks quote this thought
      x-required-scope: notes:read
      responses:
        '200': { description: Presentation links, content: { application/json: { schema: { type: object, properties: { presentations: { type: array, items: { $ref: '#/components/schemas/PresentationLink' } } } } } } }
  /notes/{noteId}/attachments:
    post:
      operationId: attach_picture
      tags: [Notes]
      summary: Put a picture on a thought
      description: |
        The part of a decision that is not a sentence — a whiteboard photo, a
        screenshot of the thing being argued about — kept with the thought
        rather than outside the space that holds everything else about it.

        Nothing the upload says about itself is believed. The type is decided by
        reading the leading bytes, and only PNG, JPEG, GIF and WebP are kept at
        all. SVG is excluded deliberately: it is XML, it can carry script, and
        these bytes are served from the application's own origin. A filename is
        kept only as a label and never decides a type.

        Sent as `multipart/form-data` with the picture in a `file` part. At most
        5MB per picture and 8 per thought; both are refused rather than
        truncated, with the limit in the answer.

        Needs edit permission on the space, like writing the thought.
      parameters:
        - { name: noteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: The stored picture, without its bytes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
  /spaces/{spaceId}/attachments:
    get:
      operationId: list_space_attachments
      tags: [Notes]
      summary: The pictures on a space's thoughts
      description: Without bytes. A canvas draws them by fetching each one, which is also where the access check happens.
      parameters:
        - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The pictures
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachments:
                    type: array
                    items: { $ref: '#/components/schemas/Attachment' }
  /attachments/{attachmentId}:
    get:
      operationId: read_attachment
      tags: [Notes]
      summary: The picture itself
      description: |
        Served with the type that was read off the bytes when they were stored,
        `X-Content-Type-Options: nosniff`, and a Content-Security-Policy of its
        own that permits nothing — so a body a browser could be talked into
        treating as a document could still do nothing. Cached immutably because
        a row is never rewritten: a changed picture is a new row with a new id.

        A picture nobody may read and a picture that does not exist answer the
        same way, because telling those apart tells a stranger what exists.
      parameters:
        - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The bytes
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: delete_attachment
      tags: [Notes]
      summary: Remove a picture
      description: Needs edit permission, like putting one on. Deleting the thought removes its pictures too.
      parameters:
        - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/Error' }
  /spaces/{spaceId}/rewind:
    get:
      operationId: rewind_space
      tags: [Notes]
      summary: What the space looked like at an instant
      description: |
        Every note update snapshots the state it replaces — the words, and where
        the note sat — so this reads material that has been accumulating since
        revisions were introduced. A revision holds the state *before* the
        change that created it, so a note's state at an instant is the earliest
        revision recorded after that instant, and if nothing was recorded after
        it the note has not changed since.

        Thoughts written later are absent. Thoughts deleted since come back,
        because they were on the canvas then.

        Connections removed since cannot be drawn: a deletion event has only
        ever carried the edge's id, and the row itself is gone. `removedEdges`
        counts them so the answer can say a connection is missing rather than
        showing a canvas that quietly omits it. Connections that still exist
        appear from when they were drawn, and only when both ends were already
        on the canvas.

        Pictures are dated the same way: `attachments` holds the ones that were
        on those thoughts at that instant, so a canvas showing June does not
        show a screenshot pasted in August. A picture whose thought has been
        deleted since cannot be fetched — the bytes are served against a thought
        that is not deleted — so it is counted in `removedAttachments` rather
        than handed over as a broken image.
      parameters:
        - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: at
          in: query
          schema: { type: string, format: date-time }
          description: RFC3339. Defaults to now. An unparsable value is refused rather than answered for now, because someone who asked about June and was shown today would not know they had been.
      responses:
        '200':
          description: The space at that instant
          content:
            application/json:
              schema:
                type: object
                properties:
                  at: { type: string, format: date-time }
                  notes:
                    type: array
                    items: { $ref: '#/components/schemas/Note' }
                  edges:
                    type: array
                    items: { $ref: '#/components/schemas/Edge' }
                  removedEdges:
                    type: integer
                    description: Connections deleted between that instant and now. They existed then and cannot be drawn.
                  attachments:
                    type: array
                    description: The pictures that were on those thoughts at that instant. Pictures added since are absent, the same as thoughts written since.
                    items: { $ref: '#/components/schemas/Attachment' }
                  removedAttachments:
                    type: integer
                    description: Pictures that were on the canvas then and cannot be drawn now, because the thought they hung on has been deleted since. A picture deleted outright leaves no row and is not counted here.
                  earliest:
                    type: string
                    format: date-time
                    description: The first moment this space has anything to show, so a control cannot offer a date before it existed.
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /spaces/{spaceId}/events:
    parameters:
      - { $ref: '#/components/parameters/SpaceID' }
    get:
      operationId: get_spaces_spaceId_events
      tags: [Collaboration]
      summary: Subscribe to authorized canvas changes with Server-Sent Events
      parameters:
        - { in: query, name: after, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Space change event stream, content: { text/event-stream: { schema: { type: string } } } }
  /spaces/{spaceId}/members:
    parameters:
      - { $ref: '#/components/parameters/SpaceID' }
    get:
      operationId: get_spaces_spaceId_members
      tags: [Collaboration]
      summary: List space members and the caller's management capability
      responses:
        '200': { description: Members, content: { application/json: { schema: { type: object, properties: { members: { type: array, items: { $ref: '#/components/schemas/SpaceMember' } }, canManage: { type: boolean } } } } } }
    post:
      operationId: post_spaces_spaceId_members
      tags: [Collaboration]
      summary: Share a space immediately or create a configured approval request
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [username, permission], properties: { username: { type: string }, permission: { type: string, enum: [view, edit, manage] } } } } } }
      responses: { '201': { description: Shared immediately }, '202': { description: Approval required }, '403': { $ref: '#/components/responses/Error' } }
  /spaces/{spaceId}/members/{memberId}:
    parameters:
      - { $ref: '#/components/parameters/SpaceID' }
      - { in: path, name: memberId, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: delete_spaces_spaceId_members_memberId
      tags: [Collaboration]
      summary: Remove a non-owner space member
      responses: { '204': { description: Member removed }, '403': { $ref: '#/components/responses/Error' } }
  /spaces/{spaceId}/export/authorize:
    parameters:
      - { $ref: '#/components/parameters/SpaceID' }
    get:
      operationId: get_spaces_spaceId_export_authorize
      tags: [Workflow]
      summary: Check whether an export is currently authorized
      parameters:
        - { in: query, name: format, schema: { type: string, enum: [markdown, image, pdf] } }
      responses: { '200': { description: Export allowed }, '409': { description: Approval required } }
  /spaces/{spaceId}/export/outline:
    get:
      operationId: export_space_outline
      tags: [Notes]
      summary: The space as a document, in the order the graph puts it
      description: |
        A different question from the Markdown export. That one answers "give
        me everything back later" and carries ids, coordinates and connections
        so a space can be restored from it. This one answers "I want to start
        writing this up", and carries none of that — the author's own sentences
        as headings and prose, and nothing a reader would skip past.

        The order is not umm's guess: a `follows` chain is somebody stating a
        sequence outright, and failing that it is the arrangement they made on
        the canvas. It compiles through the same path a deck preview does, so
        what comes out is what the preview showed. No model is involved and
        Ptium does not need to be configured.

        Subject to the same approval gate as any other export, because this is
        the space's words leaving it.
      parameters:
        - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: title, schema: { type: string }, description: Overrides the space's name as the document title. }
        - { in: query, name: includeExcluded, schema: { type: boolean }, description: Include thoughts their author held back from analysis. Off unless asked. }
        - { in: query, name: oneSlidePerThought, schema: { type: boolean }, description: Turn off grouping thoughts by where they sit, giving one section per thought. }
      responses:
        '200':
          description: The document
          content:
            text/markdown:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: A team lead has to approve this export first
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [approval_required] }
  /spaces/{spaceId}/export/markdown:
    parameters:
      - { $ref: '#/components/parameters/SpaceID' }
    get:
      operationId: get_spaces_spaceId_export_markdown
      tags: [Thoughts]
      summary: Export notes and connections as Markdown
      responses: { '200': { description: Markdown file, content: { text/markdown: { schema: { type: string } } } }, '409': { description: Approval required } }
  /handoff/targets:
    get:
      operationId: get_handoff_targets
      tags: [Thoughts]
      summary: Where a space can be sent, and as whom
      description: |
        The services an administrator has named in the `handoff` settings
        section, kept to those that receive what umm sends (`markdown`). Empty
        on a new installation, and the canvas shows no "send to another
        service" menu while it is. `source` is the origin the receiving service
        will be told to collect from: the configured public URL, or failing
        that the origin this request arrived at.
      responses:
        '200':
          description: Targets
          content:
            application/json:
              schema:
                type: object
                required: [targets, source, format]
                properties:
                  targets:
                    type: array
                    items:
                      type: object
                      required: [name, origin]
                      properties:
                        name: { type: string }
                        origin: { type: string, format: uri, description: "Scheme and host only. The browser opens `<origin>/handoff?source=<source>&claim=<claim>`." }
                  source: { type: string, format: uri }
                  format: { type: string, enum: [markdown] }
  /handoff/claims:
    post:
      operationId: post_handoff_claims
      tags: [Thoughts]
      summary: Issue a single-use claim for a space, to hand it to another service
      description: |
        The sending half of the in-house handoff standard. The claim is bound
        to one space this person may read, is good for five minutes and for one
        collection, and widens nothing: the space is checked the way every
        export is, through the same approval gate, and the document is rendered
        as this person. The document is the space's outline — its sentences in
        the order the graph puts them — rendered now and kept with the claim,
        so what is collected is exactly what `bytes` announced.

        The claim never reaches the audit log or the access log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource, format]
              properties:
                resource: { type: string, format: uuid, description: The space. }
                format: { type: string, enum: [markdown], description: umm sends Markdown and nothing else. }
      responses:
        '201':
          description: The claim
          content:
            application/json:
              schema:
                type: object
                required: [claim, source, filename, content_type, bytes, expires_at]
                properties:
                  claim: { type: string, description: 256 bits of randomness, URL-safe. }
                  source: { type: string, format: uri, description: Where to collect it from — this service's origin. }
                  filename: { type: string }
                  content_type: { type: string, enum: ['text/markdown; charset=utf-8'] }
                  bytes: { type: integer }
                  expires_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: A team lead has to approve this export first
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [approval_required] }
  /handoff/claims/{claim}:
    parameters:
      - { in: path, name: claim, required: true, schema: { type: string } }
    get:
      operationId: get_handoff_claims_claim
      security: []
      tags: [Thoughts]
      summary: Collect a handed-off document; the claim is the credential
      description: |
        No sign-in. The claim is spent by this request: a second collection,
        an expired claim and a claim that was never issued all answer 404, and
        the answer does not say which.
      responses:
        '200':
          description: The document, named by Content-Disposition
          headers:
            Content-Disposition: { schema: { type: string }, description: "attachment; filename=\"...\"; filename*=UTF-8''..." }
          content:
            text/markdown:
              schema: { type: string }
        '404': { $ref: '#/components/responses/Error' }
  /spaces/{spaceId}/edges:
    parameters:
      - { $ref: '#/components/parameters/SpaceID' }
    post:
      operationId: post_spaces_spaceId_edges
      tags: [Thoughts]
      summary: Connect two notes
      x-required-scope: notes:write
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EdgeWrite' } } } }
      responses: { '201': { description: Edge created, content: { application/json: { schema: { $ref: '#/components/schemas/Edge' } } } } }
  /ai/assist:
    post:
      operationId: post_ai_assist
      tags: [AI]
      summary: Quietly develop selected thoughts with the configured internal AI Gateway
      description: Revalidates and locks every selected note, space, and current membership through the external AI call; completed access revocation or AI exclusion prevents prompt dispatch.
      x-required-scope: ai:assist
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [noteIds, mode], properties: { noteIds: { type: array, minItems: 1, maxItems: 20, items: { type: string, format: uuid } }, mode: { type: string, enum: [summarize, questions, expand, challenge, actions] } } } } } }
      responses: { '200': { description: Generated thought aid }, '400': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' }, '503': { $ref: '#/components/responses/Error' } }
  /preferences:
    get:
      operationId: get_preferences
      tags: [Personal]
      summary: Get personal Dream and UI preferences (browser session only)
      x-session-only: true
      responses: { '200': { description: Preferences, content: { application/json: { schema: { $ref: '#/components/schemas/Preferences' } } } } }
    put:
      operationId: put_preferences
      tags: [Personal]
      summary: Partially update personal preferences (browser session only)
      description: Omitted fields retain their latest stored values. Overlapping partial requests are merged atomically, and an explicit null clears dream_pause_until.
      x-session-only: true
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PreferencesPatch' } } } }
      responses: { '200': { description: Preferences saved } }
  /api-keys:
    get:
      operationId: get_api_keys
      tags: [Personal]
      summary: List personal key metadata and allowed scopes
      x-session-only: true
      responses: { '200': { description: Key list; secrets are never returned } }
    post:
      operationId: post_api_keys
      tags: [Personal]
      summary: Create a personal API/MCP key
      x-session-only: true
      description: The secret is returned exactly once.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name, scopes], properties: { name: { type: string }, scopes: { type: array, items: { type: string } }, expiresDays: { type: integer, minimum: 1, maximum: 3650 } } } } }
      responses: { '201': { description: Key metadata and one-time secret } }
  /ai-usage:
    get:
      operationId: get_my_ai_usage
      tags: [Personal, AI]
      summary: What your own thoughts were sent to an AI model for
      x-session-only: true
      description: |
        umm lets someone hold a note back from analysis, hold a whole space
        back, and keep note bodies off an embedding gateway. That is a promise,
        and this is where a person checks it for themselves. It is scoped to the
        caller's own calls in the query, never filtered afterwards.

        A session only: this is the record of what happened to somebody's
        writing, and a key issued to a script has no business reading it.

        Two things travel with the list so it cannot be misread.
        `usage.retentionDays` is how long umm keeps these at all — without it a
        list that stops ninety days back reads as ninety quiet days.
        `embeddingsLeaveThisMachine` reports whether note bodies currently go to
        an embedding gateway, because a list of chat-model calls otherwise looks
        like the whole story: embeddings are sent in batches that can span
        several people's notes in a shared space, so naming one person for one
        batch would be a guess where the policy is a fact.

        An entry with an empty `purpose` was recorded before v0.67.0. That means
        "not recorded", not "unknown purpose".
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
          description: How far back to look. Out-of-range or unparsable values fall back to 30 rather than failing, because this is a screen someone is reading.
      responses:
        '200':
          description: The caller's own AI calls, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  usage:
                    type: object
                    properties:
                      entries:
                        type: array
                        items:
                          type: object
                          properties:
                            at: { type: string, format: date-time }
                            purpose:
                              type: string
                              enum: ['', dream, assist, ask, agent, develop, deck-headings, deck-sections]
                            model: { type: string }
                            status:
                              type: string
                              enum: [success, failed]
                              description: A failed call still sent the prompt, so it is listed.
                            inputTokens: { type: integer }
                            outputTokens: { type: integer }
                      counts:
                        type: object
                        additionalProperties: { type: integer }
                        description: Calls of each purpose in the window, over all of them rather than only the ones listed.
                      total: { type: integer }
                      truncated: { type: boolean, description: The window held more calls than entries lists. }
                      retentionDays: { type: integer }
                  since: { type: string, format: date-time }
                  days: { type: integer }
                  embeddingsLeaveThisMachine:
                    type: boolean
                    description: Whether the words in a note currently go to an embedding gateway. False means the offline algorithm and nothing sent.
                  embeddingModel: { type: string, description: Empty when nothing is sent. }
                  purposes:
                    type: array
                    items: { type: string }
                    description: The vocabulary, in the order a person reads it.
  /sessions:
    get:
      operationId: get_sessions
      tags: [Personal]
