<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="seaton-intense-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="st-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Completely Transparent Background (No Rectangle Frame) -->
  <g filter="url(#st-glow)">
    <!-- Hexagonal Edge Shield Ring -->
    <polygon points="60,10 106,35 106,85 60,110 14,85 14,35" 
             fill="none" 
             stroke="url(#seaton-intense-grad)" 
             stroke-width="4" 
             stroke-dasharray="14 6" 
             stroke-linecap="round" />
    
    <!-- Bold Sharp S Curve Monogram -->
    <path d="M 82 36 C 50 20, 28 44, 60 60 C 92 76, 70 100, 38 84" 
          fill="none" 
          stroke="url(#seaton-intense-grad)" 
          stroke-width="12" 
          stroke-linecap="round" />

    <circle cx="60" cy="60" r="7" fill="#ffffff" filter="url(#st-glow)" />
    <circle cx="82" cy="36" r="5" fill="#3b82f6" />
    <circle cx="38" cy="84" r="5" fill="#ec4899" />
  </g>
</svg>
