[package]
name = "madi-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "madi secure desktop and quick capture"
license = "Apache-2.0"

[lib]
name = "madi_desktop"
path = "src/lib.rs"

[[bin]]
name = "madi-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-deep-link", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-single-instance", "dep:reqwest", "dep:keyring", "dep:rfd", "dep:tokio"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = {version="1",features=["v4"]}
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"], optional=true }
tauri-plugin-deep-link = {version="2",optional=true}
tauri-plugin-global-shortcut = {version="2",optional=true}
tauri-plugin-single-instance = {version="2",features=["deep-link"],optional=true}
reqwest = {version="0.12",default-features=false,features=["json","rustls-tls-native-roots","multipart","stream"],optional=true}
rfd = {version="0.15",default-features=false,features=["gtk3"],optional=true}
tokio = {version="1",features=["sync"],optional=true}
keyring = {version="3.6.3",optional=true}

[target.'cfg(target_os = "linux")'.dependencies]
keyring = {version="3.6.3",features=["linux-native-sync-persistent","crypto-rust"],optional=true}
[target.'cfg(target_os = "macos")'.dependencies]
keyring = {version="3.6.3",features=["apple-native"],optional=true}
[target.'cfg(target_os = "windows")'.dependencies]
keyring = {version="3.6.3",features=["windows-native"],optional=true}

[profile.release]
codegen-units=1
lto=true
strip=true
