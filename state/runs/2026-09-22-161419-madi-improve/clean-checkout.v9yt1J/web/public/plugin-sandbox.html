<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>madi 격리 확장</title>
    <style>
      html {
        font-family: system-ui, sans-serif;
        font-size: 16px;
        color: #294337;
        background: #fbfcf8;
      }
      body {
        margin: 0;
        padding: 24px;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
        padding: 10px 16px;
        border: 1px solid #bdd1c4;
        border-radius: 7px;
        background: #eaf3e9;
        color: #205a40;
      }
      input,
      textarea,
      select {
        padding: 10px;
        border: 1px solid #c5d5c9;
        border-radius: 6px;
        max-width: 100%;
      }
      * {
        box-sizing: border-box;
      }
      img {
        max-width: 100%;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding: 16px;
        background: #eef3ea;
        border-radius: 8px;
      }
      p,
      h2 {
        margin: 0;
      }
      h2 {
        font-size: 24px;
      }
      .madi-plugin-badge {
        padding: 4px 8px;
        border-radius: 5px;
        background: #e4efd9;
        width: fit-content;
      }
      button:disabled {
        opacity: 0.5;
      }
    </style>
    <script defer src="/plugin-sandbox.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
