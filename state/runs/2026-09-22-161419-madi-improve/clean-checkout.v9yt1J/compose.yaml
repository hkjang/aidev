services:
  madi:
    image: madi:v0.3.0
    pull_policy: never
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN:?PostgreSQL 연결 문자열을 입력하세요}
      BOOTSTRAP_ADMIN: ${BOOTSTRAP_ADMIN:?초기 관리자 이메일을 입력하세요}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?초기 관리자 비밀번호를 입력하세요}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?32바이트 키의 Base64 값을 입력하세요}
    volumes:
      - madi-data:/var/lib/madi
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: 512
    tmpfs:
      # Bounded, allocated on demand. Import/restore may stage up to 1 GiB.
      - /tmp:rw,noexec,nosuid,size=2g
    stop_grace_period: 30s

volumes:
  madi-data:
