# Optional external execution environment. This is NOT required to run madi.
# Apply only to the intended dedicated runner cluster after operator review.
apiVersion: v1
kind: Namespace
metadata:
  name: madi-execution
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: madi-deny-all
  namespace: madi-execution
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: madi-execution-budget
  namespace: madi-execution
spec:
  hard:
    pods: "20"
    count/jobs.batch: "1000"
    requests.cpu: "8"
    limits.cpu: "8"
    requests.memory: 16Gi
    limits.memory: 16Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: madi-runbook-api
  namespace: madi-execution
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: madi-runbook-api
  namespace: madi-execution
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [resourcequotas]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: madi-runbook-api
  namespace: madi-execution
subjects:
  - kind: ServiceAccount
    name: madi-runbook-api
    namespace: madi-execution
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: madi-runbook-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: madi-runbook-namespace-read
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [madi-execution]
    verbs: [get]
  # If RuntimeClass is configured, add a read rule scoped to that exact name.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: madi-runbook-namespace-read
subjects:
  - kind: ServiceAccount
    name: madi-runbook-api
    namespace: madi-execution
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: madi-runbook-namespace-read
